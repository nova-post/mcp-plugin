image:
  name: zricethezav/gitleaks:v8.24.2@sha256:b5918eb91b8d2473cec722f066abb4352e4ffdc4ec9f4283ec143aba9ec9ebc4
  entrypoint: [""]

stages: [test]

variables:
  GIT_DEPTH: "0"

workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH || $CI_COMMIT_TAG'

secret_scan:
  stage: test
  script:
    - gitleaks git --redact --log-opts="--all" .
    - gitleaks dir --redact .
